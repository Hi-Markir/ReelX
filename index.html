
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReelCraft Studio | Premium Reel Maker & Content Creator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #8B5CF6;
            --primary-dark: #7C3AED;
            --secondary: #EC4899;
            --accent: #06B6D4;
            --dark: #0F0F1A;
            --dark-light: #1A1A2E;
            --dark-card: #16162A;
            --gray: #9CA3AF;
            --light: #F3F4F6;
            --white: #FFFFFF;
            --gradient-1: linear-gradient(135deg, #8B5CF6, #EC4899);
            --gradient-2: linear-gradient(135deg, #EC4899, #06B6D4);
            --gradient-3: linear-gradient(135deg, #8B5CF6, #06B6D4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark);
            color: var(--light);
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5 {
            font-family: 'Space Grotesk', sans-serif;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ========== NAVBAR ========== */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            padding: 18px 0;
            transition: all 0.4s ease;
        }

        .navbar.scrolled {
            background: rgba(15, 15, 26, 0.92);
            backdrop-filter: blur(20px);
            padding: 12px 0;
            border-bottom: 1px solid rgba(139, 92, 246, 0.15);
        }

        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo span {
            -webkit-text-fill-color: var(--white);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 35px;
            align-items: center;
        }

        .nav-links a {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--gray);
            transition: color 0.3s;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--white);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gradient-1);
            transition: width 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary {
            background: var(--gradient-1);
            color: var(--white);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.5);
        }

        .btn-outline {
            border: 2px solid rgba(139, 92, 246, 0.5);
            color: var(--white);
            background: transparent;
        }

        .btn-outline:hover {
            background: rgba(139, 92, 246, 0.1);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px;
        }

        .hamburger span {
            width: 28px;
            height: 2.5px;
            background: var(--white);
            border-radius: 2px;
            transition: all 0.3s;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        /* ========== HERO ========== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            padding: 120px 0 80px;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -200px;
            right: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -100px;
            left: -200px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.1), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(139, 92, 246, 0.25);
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--primary);
            margin-bottom: 24px;
            animation: fadeInUp 0.8s ease;
        }

        .hero-badge i {
            font-size: 0.75rem;
        }

        .hero h1 {
            font-size: 3.8rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 24px;
            animation: fadeInUp 0.8s ease 0.1s both;
        }

        .hero h1 .highlight {
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-text {
            font-size: 1.15rem;
            color: var(--gray);
            line-height: 1.7;
            margin-bottom: 40px;
            max-width: 520px;
            animation: fadeInUp 0.8s ease 0.2s both;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s ease 0.3s both;
        }

        .hero-stats {
            display: flex;
            gap: 40px;
            margin-top: 50px;
            animation: fadeInUp 0.8s ease 0.4s both;
        }

        .hero-stat h3 {
            font-size: 2rem;
            font-weight: 800;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-stat p {
            font-size: 0.85rem;
            color: var(--gray);
            margin-top: 4px;
        }

        .hero-visual {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeInRight 1s ease 0.3s both;
        }

        .phone-mockup {
            width: 300px;
            height: 600px;
            background: var(--dark-card);
            border-radius: 40px;
            border: 3px solid rgba(139, 92, 246, 0.3);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 80px rgba(139, 92, 246, 0.1);
        }

        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 28px;
            background: var(--dark);
            border-radius: 0 0 18px 18px;
            z-index: 2;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1a1a2e, #16213e, #0f3460);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .phone-screen .play-icon {
            width: 70px;
            height: 70px;
            background: var(--gradient-1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            animation: pulse 2s infinite;
        }

        .phone-screen .reel-label {
            margin-top: 16px;
            font-weight: 600;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
        }

        .phone-screen .progress-bar {
            position: absolute;
            bottom: 30px;
            left: 20px;
            right: 20px;
            height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
            overflow: hidden;
        }

        .phone-screen .progress-bar::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 65%;
            background: var(--gradient-1);
            border-radius: 4px;
            animation: progressAnim 4s ease infinite;
        }

        .floating-card {
            position: absolute;
            background: rgba(22, 22, 42, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 16px;
            padding: 16px 20px;
            animation: float 3s ease-in-out infinite;
        }

        .floating-card-1 {
            top: 60px;
            left: -60px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .floating-card-1 .icon-circle {
            width: 42px;
            height: 42px;
            background: var(--gradient-1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .floating-card-1 .fc-text p {
            font-size: 0.75rem;
            color: var(--gray);
        }

        .floating-card-1 .fc-text h4 {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .floating-card-2 {
            bottom: 100px;
            right: -50px;
            animation-delay: 1s;
        }

        .floating-card-2 .views {
            font-size: 1.3rem;
            font-weight: 800;
            background: var(--gradient-2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .floating-card-2 p {
            font-size: 0.75rem;
            color: var(--gray);
            margin-top: 2px;
        }

        .floating-card-2 .trend {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #10B981;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 6px;
        }

        /* ========== BRANDS / SOCIAL PROOF ========== */
        .brands {
            padding: 60px 0;
            border-top: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .brands p {
            text-align: center;
            color: var(--gray);
            font-size: 0.9rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
        }

        .brand-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            flex-wrap: wrap;
        }

        .brand-logos i {
            font-size: 2.2rem;
            color: rgba(255,255,255,0.25);
            transition: color 0.3s;
        }

        .brand-logos i:hover {
            color: rgba(255,255,255,0.6);
        }

        /* ========== SERVICES ========== */
        .services {
            padding: 120px 0;
        }

        .section-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .section-subtitle {
            font-size: 1.1rem;
            color: var(--gray);
            max-width: 550px;
            line-height: 1.7;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-header .section-subtitle {
            margin: 0 auto;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .service-card {
            background: var(--dark-card);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 40px 32px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-1);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .service-card:hover {
            transform: translateY(-8px);
            border-color: rgba(139, 92, 246, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .service-card:hover::before {
            opacity: 1;
        }

        .service-icon {
            width: 60px;
            height: 60px;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 24px;
            transition: all 0.4s;
        }

        .service-card:hover .service-icon {
            background: var(--gradient-1);
            color: white;
            transform: scale(1.1);
        }

        .service-card h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .service-card p {
            color: var(--gray);
            line-height: 1.7;
            font-size: 0.95rem;
        }

        /* ========== PORTFOLIO ========== */
        .portfolio {
            padding: 120px 0;
            background: var(--dark-light);
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
        }

        .portfolio-item {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 9/16;
            background: var(--dark-card);
            cursor: pointer;
            group: true;
        }

        .portfolio-item .thumb {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            transition: transform 0.5s;
        }

        .portfolio-item:nth-child(1) .thumb { background: linear-gradient(135deg, #667eea, #764ba2); }
        .portfolio-item:nth-child(2) .thumb { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .portfolio-item:nth-child(3) .thumb { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .portfolio-item:nth-child(4) .thumb { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .portfolio-item:nth-child(5) .thumb { background: linear-gradient(135deg, #fa709a, #fee140); }
        .portfolio-item:nth-child(6) .thumb { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
        .portfolio-item:nth-child(7) .thumb { background: linear-gradient(135deg, #fccb90, #d57eeb); }
        .portfolio-item:nth-child(8) .thumb { background: linear-gradient(135deg, #e0c3fc, #8ec5fc); }

        .portfolio-item:hover .thumb {
            transform: scale(1.08);
        }

        .portfolio-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.85));
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 24px;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .portfolio-item:hover .portfolio-overlay {
            opacity: 1;
        }

        .portfolio-overlay h4 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .portfolio-overlay p {
            font-size: 0.85rem;
            color: var(--gray);
        }

        .portfolio-overlay .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 50px;
            height: 50px;
            background: var(--gradient-1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s;
        }

        .portfolio-item:hover .portfolio-overlay .play-btn {
            transform: translate(-50%, -50%) scale(1);
        }

        /* ========== PROCESS ========== */
        .process {
            padding: 120px 0;
        }

        .process-steps {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            position: relative;
        }

        .process-steps::before {
            content: '';
            position: absolute;
            top: 50px;
            left: 12%;
            right: 12%;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            opacity: 0.3;
        }

        .step {
            text-align: center;
            position: relative;
        }

        .step-number {
            width: 60px;
            height: 60px;
            background: var(--dark-card);
            border: 2px solid var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
            margin: 0 auto 24px;
            position: relative;
            z-index: 1;
            transition: all 0.4s;
        }

        .step:hover .step-number {
            background: var(--gradient-1);
            color: white;
            border-color: transparent;
            transform: scale(1.1);
        }

        .step h3 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .step p {
            font-size: 0.9rem;
            color: var(--gray);
            line-height: 1.6;
        }

        /* ========== TESTIMONIALS ========== */
        .testimonials {
            padding: 120px 0;
            background: var(--dark-light);
        }

        .testimonials-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .testimonial-card {
            background: var(--dark-card);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 36px;
            transition: all 0.4s;
        }

        .testimonial-card:hover {
            transform: translateY(-5px);
            border-color: rgba(139, 92, 246, 0.2);
        }

        .stars {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
        }

        .stars i {
            color: #FBBF24;
            font-size: 0.9rem;
        }

        .testimonial-card blockquote {
            font-size: 1rem;
            line-height: 1.7;
            color: var(--gray);
            margin-bottom: 24px;
            font-style: italic;
        }

        .testimonial-author {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .testimonial-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            color: white;
        }

        .testimonial-card:nth-child(1) .testimonial-avatar { background: var(--gradient-1); }
        .testimonial-card:nth-child(2) .testimonial-avatar { background: var(--gradient-2); }
        .testimonial-card:nth-child(3) .testimonial-avatar { background: var(--gradient-3); }

        .testimonial-author h4 {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .testimonial-author p {
            font-size: 0.8rem;
            color: var(--gray);
        }

        /* ========== PRICING ========== */
        .pricing {
            padding: 120px 0;
        }

        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            align-items: start;
        }

        .pricing-card {
            background: var(--dark-card);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 40px 36px;
            transition: all 0.4s;
            position: relative;
        }

        .pricing-card.popular {
            border-color: rgba(139, 92, 246, 0.4);
            transform: scale(1.05);
            box-shadow: 0 20px 60px rgba(139, 92, 246, 0.15);
        }

        .pricing-card.popular .popular-badge {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gradient-1);
            color: white;
            padding: 6px 20px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .pricing-card:hover {
            transform: translateY(-5px);
        }

        .pricing-card.popular:hover {
            transform: scale(1.05) translateY(-5px);
        }

        .pricing-card h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .pricing-card .price-desc {
            font-size: 0.9rem;
            color: var(--gray);
            margin-bottom: 24px;
        }

        .price {
            display: flex;
            align-items: baseline;
            gap: 4px;
            margin-bottom: 30px;
        }

        .price .currency {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gray);
        }

        .price .amount {
            font-size: 3.2rem;
            font-weight: 900;
            font-family: 'Space Grotesk', sans-serif;
        }

        .price .period {
            font-size: 1rem;
            color: var(--gray);
        }

        .pricing-features {
            list-style: none;
            margin-bottom: 32px;
        }

        .pricing-features li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            font-size: 0.95rem;
            color: var(--gray);
        }

        .pricing-features li i {
            color: #10B981;
            font-size: 0.85rem;
            width: 20px;
        }

        .pricing-features li.disabled {
            opacity: 0.4;
        }

        .pricing-features li.disabled i {
            color: var(--gray);
        }

        .pricing-card .btn {
            width: 100%;
            justify-content: center;
        }

        /* ========== FAQ ========== */
        .faq {
            padding: 120px 0;
            background: var(--dark-light);
        }

        .faq-list {
            max-width: 750px;
            margin: 0 auto;
        }

        .faq-item {
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .faq-question {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
            font-family: 'Space Grotesk', sans-serif;
            transition: color 0.3s;
            background: none;
            border: none;
            color: var(--light);
            width: 100%;
            text-align: left;
        }

        .faq-question:hover {
            color: var(--primary);
        }

        .faq-question i {
            transition: transform 0.3s;
            font-size: 0.9rem;
            color: var(--primary);
        }

        .faq-item.active .faq-question i {
            transform: rotate(45deg);
        }

        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.4s ease;
        }

        .faq-item.active .faq-answer {
            max-height: 200px;
            padding-bottom: 24px;
        }

        .faq-answer p {
            color: var(--gray);
            line-height: 1.7;
            font-size: 0.95rem;
        }

        /* ========== CTA ========== */
        .cta {
            padding: 120px 0;
            position: relative;
            overflow: hidden;
        }

        .cta-box {
            background: var(--dark-card);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 32px;
            padding: 80px 60px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .cta-box::before {
            content: '';
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15), transparent 70%);
            pointer-events: none;
        }

        .cta-box h2 {
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: 16px;
            position: relative;
        }

        .cta-box p {
            font-size: 1.15rem;
            color: var(--gray);
            max-width: 500px;
            margin: 0 auto 40px;
            line-height: 1.7;
            position: relative;
        }

        .cta-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            position: relative;
        }

        /* ========== FOOTER ========== */
        .footer {
            padding: 80px 0 30px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 50px;
            margin-bottom: 60px;
        }

        .footer-brand .logo {
            margin-bottom: 16px;
            display: inline-block;
        }

        .footer-brand p {
            color: var(--gray);
            line-height: 1.7;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .social-links {
            display: flex;
            gap: 14px;
        }

        .social-links a {
            width: 42px;
            height: 42px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray);
            transition: all 0.3s;
        }

        .social-links a:hover {
            background: var(--gradient-1);
            color: white;
            transform: translateY(-3px);
        }
